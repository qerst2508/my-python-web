trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'Azure-ARM-Connection'
  containerRegistry: 'myacr2026.azurecr.io'
  imageRepository: 'my-python-app'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: BuildPush
    displayName: '🐳 Build & Push Docker Image'
    jobs:
      - job: DockerBuildPush
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # Authenticate with Azure Container Registry (replace with your ACR connection)
          - task: AzureCLI@2
            displayName: 'Login to Azure Container Registry'
            inputs:
              azureSubscription: '$(azureSubscription)' # Service connection name
              scriptType: 'bash'
              inlineScript: |
                az acr login --name $(containerRegistry)

          # Build and push the Docker image
          - task: Docker@2
            displayName: 'Build and Push Image'
            inputs:
              command: 'buildAndPush'
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: '$(containerRegistry)' # Name of your ACR
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: '🚀 Deploy Container'
    dependsOn: BuildPush
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployContainerToAppService
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy to Azure Web App'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appName: 'my-python-app-prod' # Your Azure App Service name
                    containers: '$(containerRegistry)/$(imageRepository):$(tag)'
                    # If Redis Cache or other services are needed, add them here or use environment variables.
